name: ci
on: push


jobs: 
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: node install
        run: npm install

      - name: test
        run: npm test
